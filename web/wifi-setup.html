<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tabletop — WiFi setup</title>
<style>
  :root { --bg:#12141a; --panel:#1c1f28; --line:#2c3040; --fg:#e8eaf0;
          --muted:#9aa2b5; --accent:#4a9eff; --ok:#3ddc84; --bad:#ff6b6b; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--fg);
              font:16px/1.4 system-ui,sans-serif; overflow:hidden; }
  body { display:flex; flex-direction:column; align-items:center; padding:4vh 4vw; }
  h1 { font-size:clamp(22px,3vw,34px); margin:0 0 .2em; font-weight:600; }
  .sub { color:var(--muted); margin:0 0 1.2em; font-size:clamp(14px,1.5vw,18px); }
  .panel { width:min(760px,92vw); background:var(--panel); border:1px solid var(--line);
           border-radius:14px; overflow:hidden; }
  .row { display:flex; align-items:center; gap:14px; padding:18px 20px;
         border-bottom:1px solid var(--line); cursor:pointer; }
  .row:last-child { border-bottom:0; }
  .row:active { background:#252936; }
  .row .name { flex:1; font-size:clamp(16px,1.8vw,20px); }
  .row .meta { color:var(--muted); font-size:14px; }
  .bars { width:26px; text-align:right; color:var(--accent); font-variant-numeric:tabular-nums; }
  #list { max-height:44vh; overflow-y:auto; }
  .empty { padding:28px 20px; color:var(--muted); text-align:center; }
  button { font:inherit; color:var(--fg); background:#2a2f3d; border:1px solid var(--line);
           border-radius:10px; padding:14px 18px; cursor:pointer; }
  button:active { background:#3a4050; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#08101c; font-weight:600; }
  button[disabled] { opacity:.45; }
  .bar { display:flex; gap:10px; margin-top:14px; width:min(760px,92vw); }
  .bar button { flex:1; }
  #pwView { display:none; width:min(760px,92vw); }
  #pw { width:100%; font-size:22px; padding:14px; border-radius:10px; border:1px solid var(--line);
        background:#0d0f14; color:var(--fg); letter-spacing:.06em; }
  #kb { display:grid; gap:6px; margin-top:10px; }
  #kb .krow { display:flex; gap:6px; justify-content:center; }
  #kb button { flex:1; padding:16px 0; font-size:18px; min-width:0; }
  #kb button.wide { flex:2.4; }
  #status { margin-top:16px; min-height:1.5em; font-size:17px; text-align:center; }
  .ok { color:var(--ok); } .bad { color:var(--bad); } .muted { color:var(--muted); }
  .spin { display:inline-block; width:14px; height:14px; border:2px solid var(--muted);
          border-top-color:transparent; border-radius:50%; animation:s .8s linear infinite;
          vertical-align:-2px; margin-right:8px; }
  @keyframes s { to { transform:rotate(360deg); } }
</style>

<h1>Connect this tabletop to WiFi</h1>
<p class="sub" id="sub">Choose a network.</p>

<div id="listView">
  <div class="panel"><div id="list"><div class="empty"><span class="spin"></span>Scanning…</div></div></div>
  <div class="bar"><button id="rescan">Scan again</button></div>
</div>

<div id="pwView">
  <div class="panel" style="padding:20px">
    <div class="meta" id="pwFor" style="color:var(--muted);margin-bottom:10px"></div>
    <input id="pw" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" readonly>
    <div id="kb"></div>
  </div>
  <div class="bar">
    <button id="back">Back</button>
    <button id="join" class="primary">Join network</button>
  </div>
</div>

<div id="status"></div>

<script>
const $ = s => document.querySelector(s);
let chosen = null, shift = false;

const KEYS = [
  "1234567890",
  "qwertyuiop",
  "asdfghjkl",
  "zxcvbnm",
];

function drawKb() {
  const kb = $("#kb"); kb.innerHTML = "";
  KEYS.forEach((rowStr, i) => {
    const row = document.createElement("div"); row.className = "krow";
    [...rowStr].forEach(ch => {
      const b = document.createElement("button");
      b.textContent = shift && i > 0 ? ch.toUpperCase() : ch;
      b.onclick = () => { $("#pw").value += b.textContent; };
      row.appendChild(b);
    });
    if (i === 3) {
      const sh = document.createElement("button");
      sh.textContent = shift ? "⇧ on" : "⇧";
      sh.onclick = () => { shift = !shift; drawKb(); };
      row.insertBefore(sh, row.firstChild);
      const bs = document.createElement("button");
      bs.textContent = "⌫";
      bs.onclick = () => { $("#pw").value = $("#pw").value.slice(0, -1); };
      row.appendChild(bs);
    }
    kb.appendChild(row);
  });
  const row = document.createElement("div"); row.className = "krow";
  "-_.@!#$%&*+=/:?".split("").forEach(ch => {
    const b = document.createElement("button"); b.textContent = ch;
    b.onclick = () => { $("#pw").value += ch; };
    row.appendChild(b);
  });
  const sp = document.createElement("button");
  sp.textContent = "space"; sp.className = "wide";
  sp.onclick = () => { $("#pw").value += " "; };
  row.appendChild(sp);
  kb.appendChild(row);
}

function bars(sig) {
  const n = Math.max(1, Math.min(4, Math.round(sig / 25)));
  return "▂▄▆█".slice(0, n);
}

async function scan() {
  $("#list").innerHTML = '<div class="empty"><span class="spin"></span>Scanning…</div>';
  try {
    const nets = await (await fetch("/api/scan")).json();
    if (!nets.length) {
      $("#list").innerHTML = '<div class="empty">No networks found. Move closer to the access point and scan again.</div>';
      return;
    }
    $("#list").innerHTML = "";
    nets.forEach(n => {
      const d = document.createElement("div"); d.className = "row";
      d.innerHTML = `<span class="bars">${bars(n.signal)}</span>
                     <span class="name"></span>
                     <span class="meta">${n.secure ? "🔒" : "open"}</span>`;
      d.querySelector(".name").textContent = n.ssid;
      d.onclick = () => choose(n);
      $("#list").appendChild(d);
    });
  } catch (e) {
    $("#list").innerHTML = '<div class="empty bad">Could not scan. Is the radio present?</div>';
  }
}

function choose(n) {
  chosen = n;
  $("#listView").style.display = "none";
  $("#pwView").style.display = "block";
  $("#sub").textContent = n.secure ? "Enter the password." : "Open network — no password needed.";
  $("#pwFor").textContent = "Network: " + n.ssid;
  $("#pw").value = "";
  $("#pw").style.display = n.secure ? "block" : "none";
  $("#kb").style.display = n.secure ? "grid" : "none";
  shift = false; drawKb();
}

$("#back").onclick = () => {
  $("#pwView").style.display = "none";
  $("#listView").style.display = "block";
  $("#sub").textContent = "Choose a network.";
  $("#status").textContent = "";
};
$("#rescan").onclick = scan;

$("#join").onclick = async () => {
  const psk = $("#pw").value;
  if (chosen.secure && psk.length < 8) {
    $("#status").className = "bad";
    $("#status").textContent = "WPA passwords are at least 8 characters.";
    return;
  }
  $("#join").disabled = true;
  $("#status").className = "muted";
  $("#status").innerHTML = '<span class="spin"></span>Saving and connecting…';
  // The request blocks through both joining and clock sync, so narrate it —
  // otherwise a minute of silence looks like a hang.
  const phases = ["Saving and connecting…", "Joining the network…",
                  "Setting the clock…", "Almost there…"];
  let phase = 0;
  const ticker = setInterval(() => {
    phase = Math.min(phase + 1, phases.length - 1);
    $("#status").innerHTML = '<span class="spin"></span>' + phases[phase];
  }, 8000);
  try {
    const r = await fetch("/api/connect", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ ssid: chosen.ssid, psk: psk })
    });
    clearInterval(ticker);
    const res = await r.json();
    if (res.connected && res.clock) {
      $("#status").className = "ok";
      $("#status").textContent = "Connected. Starting the tabletop…";
      setTimeout(() => { location.href = res.launcher; }, 1500);
    } else if (res.connected) {
      // Joined, but the clock never synchronised. Redirecting now would land on
      // a TLS certificate error with no keyboard to dismiss it, which is exactly
      // how the first version of this portal failed.
      $("#status").className = "bad";
      $("#status").textContent = res.error;
      $("#join").disabled = false;
    } else {
      $("#status").className = "bad";
      $("#status").textContent = res.error || "Could not connect. Check the password and try again.";
      $("#join").disabled = false;
    }
  } catch (e) {
    clearInterval(ticker);
    $("#status").className = "bad";
    $("#status").textContent = "The setup service stopped responding.";
    $("#join").disabled = false;
  }
};

scan();
</script>
